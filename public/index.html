<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>J.A.R.V.I.S. 2050</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-fx"></div>

  <div class="app">

    <!-- Top status bar -->
    <header class="topbar">
      <div class="topbar-left">
        <span class="logo-badge">✦</span>
        <div class="title-block">
          <h1>JARVIS 2050</h1>
          <span class="sub" id="hpStat">99.98%</span>
        </div>
      </div>
      <div class="topbar-right">
        <span class="pill-icon" title="Signal">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 21l-1.5-1.5C6 15 3 12.4 3 9.1 3 6.6 5 4.5 7.5 4.5c1.6 0 3.1.8 4 2.1.9-1.3 2.4-2.1 4-2.1C18 4.5 20 6.6 20 9.1c0 3.3-3 5.9-7.5 10.4L12 21z"/></svg>
        </span>
        <span class="pill-icon" title="Neural link">
          <svg viewBox="0 0 24 24" width="16" height="16"><circle cx="12" cy="12" r="3" fill="currentColor"/><circle cx="4" cy="6" r="2" fill="currentColor"/><circle cx="20" cy="6" r="2" fill="currentColor"/><circle cx="4" cy="18" r="2" fill="currentColor"/><circle cx="20" cy="18" r="2" fill="currentColor"/><path stroke="currentColor" stroke-width="1" d="M4 6l8 6M20 6l-8 6M4 18l8-6M20 18l-8-6"/></svg>
        </span>
        <button id="voiceToggle" class="pill-icon" title="Toggle voice output" aria-label="Toggle voice output">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12z"/></svg>
        </button>
      </div>
    </header>

    <!-- Decorative tabs -->
    <nav class="tabbar">
      <button class="tab active">◈ 3D CORE</button>
      <button class="tab">∿ TELEMETRY</button>
      <button class="tab">((•)) RADAR</button>
      <button class="tab">⌁ DECISION TREE</button>
      <button class="tab" id="terminalTab">&gt;_ TERMINAL</button>
    </nav>

    <div class="viewbar">
      <div class="camera-tabs">
        <span class="cam active">FRONT</span>
        <span class="cam">TACTICAL</span>
        <span class="cam">ORBITAL</span>
        <span class="cam">CLOSEUP</span>
      </div>
      <div class="stats-row">
        <span>CPU: <b id="cpuStat">42%</b></span>
        <span class="sep">·</span>
        <span>LATENCY: <b>0.12ps</b></span>
        <span class="sep">·</span>
        <span>SOL-3</span>
      </div>
    </div>

    <!-- Core visualization -->
    <main class="core-stage" id="coreStage">
      <div class="orbit-ring ring-a"></div>
      <div class="orbit-ring ring-b"></div>
      <div class="orbit-ring ring-c"></div>

      <div class="particle p1"></div>
      <div class="particle p2"></div>
      <div class="particle p3"></div>
      <div class="particle p4"></div>
      <div class="particle p5"></div>
      <div class="particle p6"></div>
      <div class="particle p7"></div>
      <div class="particle p8"></div>

      <div class="core-sphere" id="coreSphere">
        <svg class="wireframe" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <circle cx="100" cy="100" r="90" />
          <circle cx="100" cy="100" r="65" />
          <circle cx="100" cy="100" r="40" />
          <line x1="10" y1="100" x2="190" y2="100" />
          <line x1="100" y1="10" x2="100" y2="190" />
          <line x1="30" y1="30" x2="170" y2="170" />
          <line x1="170" y1="30" x2="30" y2="170" />
          <line x1="20" y1="60" x2="150" y2="20" />
          <line x1="180" y1="60" x2="50" y2="20" />
          <line x1="20" y1="140" x2="150" y2="180" />
          <line x1="180" y1="140" x2="50" y2="180" />
        </svg>
        <div class="core-glow-center"></div>
      </div>
    </main>

    <p class="activate-label" id="activateLabel">[ TAP CORE TO ACTIVATE JARVIS ]</p>

    <div class="bottom-actions">
      <button id="commandBtn" class="ghost-btn">&gt;_ COMMAND INTERFACE</button>
      <button id="scanBtn" class="ghost-btn">((•)) SCAN</button>
    </div>

    <!-- Chat panel -->
    <section class="chat-panel" id="chatPanel">
      <div id="chatWindow" class="chat-window">
        <div class="message jarvis">
          <div class="bubble">Systems online. I am JARVIS, your personal AI assistant. How may I help you today?</div>
        </div>
      </div>

      <div id="thinking" class="thinking hidden">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        JARVIS is thinking...
      </div>

      <form id="chatForm" class="input-bar" autocomplete="off">
        <button type="button" id="micBtn" class="icon-btn mic-btn" title="Voice input" aria-label="Voice input">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
        </button>
        <input id="userInput" type="text" placeholder="Command interface..." aria-label="Message JARVIS" />
        <button type="submit" id="sendBtn" class="send-btn" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
        </button>
      </form>
    </section>

    <footer class="footer">
      <span>JARVIS AI · Powered by Gemini</span>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
